version: '3.8'

services:
  penpot-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: penpot-mcp-server
    image: penpot-mcp:latest
    environment:
      - PENPOT_API_URL=${PENPOT_API_URL:-https://design.penpot.app/api}
      - PENPOT_USERNAME=${PENPOT_USERNAME}
      - PENPOT_PASSWORD=${PENPOT_PASSWORD}
      - PORT=${PORT:-5000}
      - DEBUG=${DEBUG:-false}
    ports:
      - "${PORT:-5000}:5000"
    restart: unless-stopped
    networks:
      - penpot-network
    volumes:
      # Optional: Mount for cache persistence
      - penpot-cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  penpot-cache:
    driver: local

networks:
  penpot-network:
    driver: bridge
